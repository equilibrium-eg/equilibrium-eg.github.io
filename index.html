<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاتزان الكيميائي — Chemical Equilibrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>:root{
  --navy:#1b3358; --navy2:#22416d;
  --bg1:#eef4fc; --bg2:#f7f9fe; --card:#ffffff; --line:#dbe6f5;
  --ink:#1c2a3f; --muted:#5b6b82;
  --blue:#1d5fc2; --blue2:#2f7be6; --blueSoft:#e7f0fd;
  --green:#0d8a5b; --green2:#15a46d; --greenSoft:#e5f7ee;
  --purple:#6a44c2; --purple2:#8a63e0; --purpleSoft:#f0eafd;
  --red:#e0474c; --amber:#f2b33d;
  --radius:22px; --shadow:0 6px 24px rgba(34,65,109,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Inter',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 500px at 85% -10%,#dfeafc 0,transparent 60%),
  radial-gradient(900px 500px at 0% 100%,#e8e4fb 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));
  min-height:100vh;line-height:1.7}
html[lang=en] body{font-family:'Inter','Cairo',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:3px solid #f2b33d;outline-offset:2px}
.eq{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Inter',sans-serif;font-weight:600;white-space:nowrap}
.eqblock{direction:ltr;text-align:center;font-family:'Inter',sans-serif;font-weight:600;font-size:1.12em;background:#f4f7fd;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;overflow-x:auto}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.frac>span{padding:0 4px}

/* NAV */
.nav{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 26px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.15rem;flex:1;min-width:0}
.brand .atom-e{display:inline}
@media (prefers-reduced-motion:reduce){.atom-e{display:none!important}}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlinks{display:flex;gap:6px;align-items:center}
.navlinks button{background:transparent;border:0;color:#e8eefb;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;font-size:.95rem;font-weight:600}
.navlinks button:hover{background:rgba(255,255,255,.1)}
.navlinks svg{width:20px;height:20px}
.lang{border:1px solid rgba(255,255,255,.35)!important}
.navlinks{position:relative}
.hamb{width:44px;height:44px;justify-content:center;background:rgba(255,255,255,.12)!important;padding:0!important}
.hamb .hb-i{display:inline!important;font-size:1.45rem;line-height:1}
.navmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:220px;background:#fff;border-radius:16px;box-shadow:0 14px 40px rgba(15,35,75,.25);padding:8px;display:none;flex-direction:column;z-index:60}
.navmenu.open{display:flex;animation:bubIn .18s ease-out}
.navlinks .navmenu button{color:#1b3358;width:100%;justify-content:flex-start;padding:11px 14px;font-size:1rem}
.navlinks .navmenu button span{display:inline!important}
.navlinks .navmenu button:hover{background:#eef3fb}
.navmenu svg{color:#5b6b82}
.navmenu hr{border:0;border-top:1px solid #e3eaf5;margin:6px 4px}
.navlinks .navmenu button.out,.navmenu .out svg{color:#d93636}

.wrap{max-width:1240px;margin:0 auto;padding:24px 22px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.banner{background:linear-gradient(120deg,#e9f0fe,#f1edfd);border:1px solid #d9e2f8;border-radius:var(--radius);padding:22px 28px;display:flex;align-items:center;gap:22px;justify-content:center;text-align:center;position:relative;overflow:hidden}
.banner h1{margin:0;font-size:2rem;font-weight:900;color:#13284a;line-height:1.3}
.banner p{margin:6px 0 0;color:#33445e;font-size:1.08rem}
.spark{position:absolute;width:46px;height:30px;top:18px;inset-inline-start:22px}
.btn{border:0;border-radius:16px;padding:13px 24px;font-size:1.05rem;font-weight:800;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 14px rgba(29,95,194,.22);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.blue{background:linear-gradient(180deg,var(--blue2),var(--blue))}
.btn.green{background:linear-gradient(180deg,var(--green2),var(--green));box-shadow:0 5px 14px rgba(13,138,91,.22)}
.btn.purple{background:linear-gradient(180deg,var(--purple2),var(--purple));box-shadow:0 5px 14px rgba(106,68,194,.22)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.92rem;border-radius:12px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff4dc;color:#8a5a00;border:1px solid #f4dca4}
.tag.ill{background:#eef3fb;color:#3d5579;border-color:#d4def0}

/* LOGIN */
.login{max-width:980px;margin:30px auto;display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:stretch}
.login .hero{background:linear-gradient(150deg,#e3edfd,#efe9fd);border-radius:var(--radius);padding:30px;border:1px solid #d6e0f6;position:relative;overflow:hidden}
.login h1{font-size:2.1rem;line-height:1.3;margin:0 0 6px;color:#13284a;font-weight:900}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700}
.field input{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.05rem;background:#fbfcff}
.field input:focus{border-color:var(--blue2);outline:none;box-shadow:0 0 0 3px #dbe8fd}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted);margin:6px 0 16px}
.consent input{margin-top:6px;width:18px;height:18px}

/* LOGIN + GUIDE ROBOT */
.login2{max-width:1180px;margin:24px auto;display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center}
.lcol{display:flex;flex-direction:column;gap:18px}
.login2 .hero{background:linear-gradient(150deg,#e3edfd,#efe9fd);border-radius:var(--radius);padding:22px 26px;border:1px solid #d6e0f6}
.login2 h1{font-size:2.1rem;line-height:1.3;margin:4px 0;color:#13284a;font-weight:900}
.rstage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:520px;
  background:radial-gradient(closest-side,#e4eefc 0,#e4eefc 55%,transparent 100%);border-radius:40px}
.rbot{width:330px;max-width:80%;transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%;animation:rbIn .9s cubic-bezier(.3,1.4,.5,1) both}
.rbot.big{transform:scale(1.08)}
.rbot.pop{animation:rbPop .6s ease}
.rbot.jump .rb-body{animation:rbJump .7s ease 2}
.rb-svg{width:100%;height:auto;overflow:visible;display:block}
.rb-head{animation:rbBob 3s ease-in-out infinite;transform-box:view-box;transform-origin:110px 140px}
.rb-eyes{animation:rbBlink 4.5s infinite;transform-box:view-box;transform-origin:110px 84px}
.rb-ant{animation:rbAnt 1.6s ease-in-out infinite}
.rb-chest{animation:rbAnt 1.2s ease-in-out infinite}
.rb-wave{transform-box:view-box;transform-origin:76px 159px}
.rbot.wave .rb-wave{animation:rbWave .5s ease-in-out 6 alternate}
.rb-point{transform-box:view-box;transform-origin:148px 159px;transform:rotate(65deg);transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.rbot.point .rb-point rect:last-child{animation:rbTap .8s ease-in-out infinite alternate}
.rbubble{position:relative;align-self:stretch;margin:0 8% 14px;background:#fff;border:2px solid #cfe0f7;border-radius:24px;padding:16px 20px;font-size:1.25rem;font-weight:800;color:#13284a;
  box-shadow:0 10px 30px rgba(29,95,194,.15);min-height:70px;opacity:0;transform:translateY(8px) scale(.96)}
.rbubble.show{animation:bubIn .35s ease forwards}
.rbubble:after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.rbubble .caret{display:inline-block;width:3px;height:1.1em;background:#2f7be6;margin-inline-start:3px;vertical-align:-3px;animation:caret 1s steps(1) infinite}
.rskip{margin-top:12px}
.glow{position:relative;border-radius:14px;animation:glow 1.3s ease-in-out infinite}
input.glow{border-color:var(--blue2)!important}
@keyframes rbIn{from{transform:translateX(-80px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rbPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1.08)}}
@keyframes rbJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}}
@keyframes rbBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes rbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rbAnt{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes rbWave{from{transform:rotate(-12deg)}to{transform:rotate(28deg)}}
@keyframes rbTap{from{transform:translateX(0)}to{transform:translateX(6px)}}
@keyframes bubIn{to{opacity:1;transform:none}}
@keyframes caret{50%{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(242,179,61,.35)}50%{box-shadow:0 0 0 8px rgba(242,179,61,.55)}}
/* WELCOME WALKER */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wb-home{display:inline-block;transition:opacity .25s}
.wb-home.away{opacity:0}
.walker{position:absolute;left:0;top:0;z-index:35;pointer-events:none;will-change:transform}
.wb-body{width:100%;height:100%}
.walker.face-l .wb-svg{transform:scaleX(-1)}
.wb-svg{width:100%;height:100%;overflow:visible;display:block}
.wb-svg .f,.wb-svg .p{display:none}
.walker:not([class*="m-"]) .f-normal{display:inline}
.walker.m-great .f-great,.walker.m-great .p-great,.walker.m-good .f-good,.walker.m-nervous .f-nervous,.walker.m-nervous .p-nervous,.walker.m-tired .f-tired,.walker.m-tired .p-tired{display:inline}
.wb-legL,.wb-legR{transform-box:fill-box;transform-origin:50% 0}
.wb-armL,.wb-armR{transform-box:fill-box;transform-origin:50% 8%}
.wb-head{transform-box:view-box;transform-origin:50px 60px}
.wb-thumb{display:none}
.walker.run .wb-legL{animation:legs .22s ease-in-out infinite alternate}
.walker.run .wb-legR{animation:legs .22s ease-in-out infinite alternate-reverse}
.walker.run .wb-armL{animation:legs .22s ease-in-out infinite alternate-reverse}
.walker.run .wb-armR{animation:legs .22s ease-in-out infinite alternate}
.walker.run .wb-torso{animation:bounce .22s ease-in-out infinite alternate}
.walker.land .wb-body{animation:land .3s ease}
.walker.m-great .wb-armL{transform:rotate(150deg)}.walker.m-great .wb-armR{transform:rotate(-150deg)}
.walker.m-great .wb-body{animation:hop .5s ease-in-out infinite alternate}
.walker.m-good .wb-armR{transform:rotate(-120deg)}.walker.m-good .wb-thumb{display:inline}
.walker.m-good .wb-head{animation:nod 1s ease-in-out infinite}
.walker.m-nervous .wb-body{animation:shiver .09s linear infinite alternate}
.walker.m-nervous .wb-armL{transform:rotate(25deg)}.walker.m-nervous .wb-armR{transform:rotate(-25deg)}
.walker.m-tired .wb-torso{transform:translateY(5px)}
.walker.m-tired .wb-head{transform:rotate(-12deg)}
.walker.m-tired .wb-armL,.walker.m-tired .wb-armR{transform:rotate(8deg)}
.walker.m-tired .p-tired{animation:zz 1.6s ease-in-out infinite}
.wb-bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:#fff;border:2px solid #cfe0f7;border-radius:16px;padding:4px 10px;font-size:1.3rem;
  white-space:nowrap;box-shadow:0 6px 18px rgba(29,95,194,.18);opacity:0;transition:opacity .25s}
.wb-bub.big{white-space:normal;width:max-content;max-width:min(300px,86vw);font-size:1rem;font-weight:800;color:#13284a;padding:10px 14px;line-height:1.6}
.wb-bub.show{opacity:1}
.wb-bub.big.side{bottom:auto;top:50%;left:auto;right:100%;transform:translateY(-50%);margin:0 12px 0 0;max-width:500px;font-size:.95rem;padding:8px 14px}
.wb-bub.side:after{top:50%;left:100%;margin:-8px 0 0;border:8px solid transparent;border-left-color:#fff}
.wb-bub:after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
@keyframes legs{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes land{0%{transform:scale(1.12,.86)}100%{transform:none}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes shiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-4px);opacity:1}}
.offline-note{max-width:520px;margin:12px auto 0;font-size:.9rem;color:#0b5b3d;background:#e6f8ef;border:1px solid #bfe9d3;border-radius:14px;padding:8px 14px}
.coach-bub{position:fixed;bottom:96px;inset-inline-end:20px;z-index:44;max-width:min(320px,calc(100vw - 32px));background:#fff;border:2px solid #cfe0f7;border-radius:18px;padding:10px 14px;font-weight:800;color:#13284a;line-height:1.6;
  box-shadow:0 10px 30px rgba(29,95,194,.2);opacity:0;transform:translateY(10px) scale(.95);pointer-events:none;transition:opacity .25s,transform .25s}
.coach-bub.show{opacity:1;transform:none;pointer-events:auto}
.coach-bub .cb-x{position:absolute;top:4px;inset-inline-end:8px;background:none;border:0;color:#8a99b2;font-size:1rem;padding:2px 4px}
.coach-bub .cb-t{padding-inline-end:22px}
.coach-bub .cb-a{gap:8px;flex-wrap:wrap;margin-top:8px}
.coach-bub .cb-m{display:block;margin-top:8px;background:#f2f6fd;border:1px solid #dbe6f5;border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700;color:#5b6b82}
.mute-badge{position:fixed;bottom:30px;inset-inline-end:270px;z-index:44;background:#fff;border:1.5px solid #dbe6f5;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem;color:#1b3358;box-shadow:0 6px 18px rgba(20,40,80,.15)}
@media (max-width:640px){.mute-badge{inset-inline-end:84px;bottom:28px;font-size:.78rem;padding:5px 10px}}
.coach-bub:after{content:"";position:absolute;top:100%;inset-inline-end:34px;border:9px solid transparent;border-top-color:#fff}
.fab.talk svg{animation:rbJump .6s ease 2}
@media (max-width:640px){
  .eq{white-space:normal;overflow-wrap:anywhere}
  html,body{overflow-x:clip}.coach-bub{bottom:76px;inset-inline-end:12px}}
/* DASHBOARD */
.dash{display:grid;grid-template-columns:1fr 290px;gap:22px}
html[dir=rtl] .dash{grid-template-columns:1fr 290px}
.side{display:flex;flex-direction:column;gap:18px}
.scorebox{padding:0;overflow:hidden}
.scorebox h3{margin:0;background:#f2f6fd;padding:12px 18px;text-align:center;font-size:1.05rem}
.ring{display:block;margin:16px auto 4px}
.weak li{display:flex;gap:10px;align-items:center;margin:6px 0;font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.85rem;flex:none}
.dot.r{background:var(--red)} .dot.g{background:var(--green2)}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.path{border-radius:var(--radius);padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;border:1.5px solid var(--line);position:relative;background:#fff;box-shadow:var(--shadow)}
.path.blue{background:linear-gradient(180deg,#eef4ff,#fff 60%)}
.path.green{background:linear-gradient(180deg,#e8f8f0,#fff 60%)}
.path.purple{background:linear-gradient(180deg,#f3eefe,#fff 60%)}
.path.rec{border:2.5px solid var(--green2);box-shadow:0 10px 30px rgba(13,138,91,.18)}
.path.rec.blue{border-color:var(--blue2);box-shadow:0 10px 30px rgba(29,95,194,.18)}
.path.rec.purple{border-color:var(--purple2);box-shadow:0 10px 30px rgba(106,68,194,.18)}
.recbadge{position:absolute;top:-16px;padding:4px 18px;border-radius:999px;color:#fff;font-weight:800;font-size:.9rem}
.pill{width:100%;border-radius:999px;color:#fff;font-weight:900;font-size:clamp(.95rem,1.35vw,1.2rem);white-space:nowrap;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:10px}
.pill.blue{background:linear-gradient(180deg,var(--blue2),var(--blue))}
.pill.green{background:linear-gradient(180deg,var(--green2),var(--green))}
.pill.purple{background:linear-gradient(180deg,var(--purple2),var(--purple))}
.path .ill{height:130px;margin:10px 0}
.path p{margin:4px 0 12px;color:#33445e}
.what{width:100%;border-radius:14px;padding:6px 0;font-weight:800}
.what.blue{background:var(--blueSoft);color:#183d78}.what.green{background:var(--greenSoft);color:#0b5b3d}.what.purple{background:var(--purpleSoft);color:#43278a}
.feat{list-style:none;padding:0;margin:10px 0 16px;text-align:start;width:100%}
.feat li{display:flex;gap:10px;align-items:center;margin:6px 8px}
.range{font-size:.85rem;font-weight:700;color:var(--muted);margin-top:4px}
.helpbar{display:flex;gap:18px;align-items:center;margin-top:24px}
.bubble{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 20px;text-align:center;box-shadow:var(--shadow)}

/* QUIZ */
.qwrap{max-width:820px;margin:0 auto}
.progress{height:10px;background:#e3eaf6;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--purple2));border-radius:99px;transition:width .3s}
.opt{display:flex;width:100%;text-align:start;gap:12px;align-items:center;background:#fbfcff;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;margin:9px 0;font-size:1.03rem;color:var(--ink)}
.opt:hover{border-color:#a9c3ec;background:#f4f8ff}
.opt.sel{border-color:var(--blue2);background:#eaf2ff}
.opt.ok{border-color:var(--green2);background:#e6f8ef}
.opt.no{border-color:var(--red);background:#fdeced}
.opt .k{width:30px;height:30px;border-radius:50%;background:#e9eff9;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.fb{border-radius:16px;padding:12px 16px;margin-top:12px;font-weight:600}
.fb.ok{background:#e6f8ef;color:#0b5b3d;border:1px solid #bfe9d3}
.fb.hint{background:#fffaf0;color:#5b3d00;border:1px dashed #f0c46b}
.fb.hint>div{margin:3px 0}
.hintb{background:#fff8e6;color:#8a5a00;border:1.5px solid #f4dca4;box-shadow:none;flex:none}
.chatact{margin-top:2px;font-size:.82rem!important;padding:5px 10px!important}
.fb.no{background:#fff4e6;color:#7a4300;border:1px solid #f6d7a8}

.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.qn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#f2f5fa;color:var(--muted);font-weight:800;font-family:'Inter',sans-serif;position:relative}
.qn.a{background:var(--blue);border-color:var(--blue);color:#fff}
.qn.cur{outline:3px solid var(--navy);outline-offset:1px}
.qn.f:after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #fff}
.flagb{background:#fff;color:#8a5a00;border:1.5px solid #f4dca4;box-shadow:none;flex:none}
.flagb.on{background:#fff4dc}
/* UNIT / PATH */
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:18px}
.ucard{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;text-align:start}
.ucard h3{margin:0;font-size:1.1rem}

.section{margin:18px 0}
.section h2{font-size:1.35rem;margin:0 0 8px;color:#13284a}
.kp{list-style:none;padding:0;margin:0}
.kp li{position:relative;padding-inline-start:28px;margin:8px 0}
.kp li:before{content:"";position:absolute;inset-inline-start:4px;top:.62em;width:12px;height:12px;border-radius:4px;background:var(--blue2)}
.mis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}

.mis .r{background:#e6f8ef;border:1px solid #bfe9d3}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}

.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* SIMS */
.sim{background:#fbfcff;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.simhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.simhead h3{margin:0;font-size:1.12rem}
.simgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
canvas{max-width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.counter{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.counter>div{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.predict{background:#fffaf0;border:1px dashed #f0c46b;border-radius:14px;padding:10px 14px;margin:10px 0}
.kcrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}

.kcrow select{font-family:inherit;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line)}
.numin{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:1.05rem;width:140px;direction:ltr}

/* CHAT */
.fab{position:fixed;bottom:20px;inset-inline-end:20px;z-index:40;border:0;background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;border-radius:999px;padding:8px 18px 8px 10px;display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:0 8px 24px rgba(29,95,194,.35)}

.fab svg{width:42px;height:42px}
.chat{position:fixed;bottom:86px;inset-inline-end:20px;width:390px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 120px);background:#fff;border:1.5px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(20,40,80,.25);z-index:45;display:none;flex-direction:column;overflow:hidden}

.mode{font-size:.78rem;padding:5px 12px;text-align:center}
.mode.demo{background:#fff4dc;color:#7a4b00}
.mode.live{background:#e6f8ef;color:#0b5b3d}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f6f9fe}
.m{max-width:85%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;font-size:.97rem}
.m.bot{background:#fff;border:1px solid var(--line);align-self:flex-start}
.m.me{background:var(--blue);color:#fff;align-self:flex-end}
.starters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;border-top:1px solid var(--line)}
.starters button{white-space:nowrap;flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:.82rem;color:var(--navy)}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatin input{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:1rem}

.report td,.report th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
.report{width:100%;border-collapse:collapse}
.bar{height:12px;border-radius:99px;background:#e3eaf6;overflow:hidden}
.bar>i{display:block;height:100%}
.moods{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.moods button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 24px;font-weight:800;font-size:1.05rem;color:var(--blue)}
.banner .moods{margin-top:150px;gap:14px}
.moods button.on{border-color:var(--blue2);background:#eaf2ff}
.axes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
.axes>div{border-radius:18px;padding:14px;border:1px solid var(--line)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}

/* ---- intro: Acquire peeks in from the left edge, then zooms into the screen ---- */
body.intro-on{overflow:hidden}
.intro{position:fixed;inset:0;z-index:300;background:radial-gradient(ellipse at 30% 50%,#0d1f42 0,#060b18 55%,#02040a 100%);overflow:hidden;direction:rtl}
.intro.out{animation:inOut .45s ease forwards}
@keyframes inOut{to{opacity:0}}
.pk{position:absolute;left:50%;top:46%;width:min(840px,124vw);aspect-ratio:180/150;transform:translate3d(calc(-50vw - 44%),-50%,0) scale(.5);transform-origin:50% 50%;opacity:0;will-change:transform,opacity;backface-visibility:hidden;
}
.intro.go .pk{animation:pkIn .18s ease-out .5s forwards,pkZoom 1s cubic-bezier(.65,0,.35,1) 3s forwards,pkGone .3s linear 3.85s forwards}
@keyframes pkGone{to{opacity:0;visibility:hidden}}
.pk-tilt{width:100%;height:100%;transform:rotate(28deg);transform-origin:50% 60%}
.intro.go .pk-tilt{animation:pkStraight 1s cubic-bezier(.65,0,.35,1) 3s forwards}
.pk-svg{width:100%;height:100%;overflow:visible}
.pk::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(94,230,255,.22),transparent 65%)}
@keyframes pkIn{to{opacity:1}}
@keyframes pkZoom{0%{transform:translate3d(calc(-50vw - 44%),-50%,0) scale(.5)}100%{opacity:1;transform:translate3d(-50%,-50%,0) scale(4.6)}}
@keyframes pkStraight{to{transform:rotate(0)}}
.intro .pk-eyes{transform-box:fill-box;transform-origin:center;opacity:.12;filter:drop-shadow(0 0 5px #5ee6ff)}
.intro.go .pk-eyes{animation:pkEyes .6s steps(1,end) .9s forwards,pkBlink .5s ease 2.3s 1}
@keyframes pkEyes{0%{opacity:.12}20%{opacity:1}40%{opacity:.3}60%,100%{opacity:1}}
@keyframes pkBlink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
.intro .pk-mouth{opacity:0}
.intro.go .pk-mouth{animation:pkIn .3s ease 1.3s forwards}
.pk-h1,.pk-h2{position:absolute;left:-6px;width:min(88px,15vw);opacity:0;will-change:transform,opacity}
.intro.go .pk-h1,.intro.go .pk-h2{animation:pkIn .18s ease-out .5s forwards,pkHandOut .3s ease 3.05s forwards}
.pk-h1{top:calc(46% - min(210px,31vw) - 6px)}.pk-h2{top:calc(46% + min(155px,23vw))}
.pk-hand{width:100%;height:auto;display:block}
@keyframes pkHandOut{to{opacity:0;transform:translateX(-30px)}}
.in-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#ffffff 0,#bfe9ff 35%,#1d5fc2 100%);opacity:0;pointer-events:none;will-change:opacity}
.intro.go .in-flash{animation:inFlash 1s ease 3.6s forwards}
@keyframes inFlash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.in-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transform:scale(.92)}
.intro.go .in-title{animation:inTitle .8s ease 4.2s forwards}
.in-title svg{width:clamp(80px,22vw,120px);height:auto;filter:drop-shadow(0 0 18px rgba(120,180,255,.7));margin-bottom:8px}
.in-title b{color:#fff;font-size:clamp(1.8rem,7vw,2.8rem);font-weight:900;text-shadow:0 0 24px rgba(94,170,255,.6)}
.in-title span{color:#9fb6d6;font-weight:600}
@keyframes inTitle{to{opacity:1;transform:none}}
.in-skip{position:absolute;bottom:24px;inset-inline-start:24px;z-index:2;background:rgba(255,255,255,.1);color:#dfe9fa;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 18px;font-weight:700;font-size:.95rem}
.in-skip:hover{background:rgba(255,255,255,.2)}
.in-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:2}
.intro.go .in-start{animation:inHide .35s ease forwards;pointer-events:none}
@keyframes inHide{to{opacity:0;visibility:hidden}}
.in-go{font-family:inherit;font-size:clamp(1.2rem,5vw,1.6rem);font-weight:900;color:#fff;border:0;border-radius:999px;padding:16px 38px;background:linear-gradient(180deg,#2f7be6,#1d5fc2);box-shadow:0 0 0 0 rgba(94,230,255,.6),0 10px 30px rgba(29,95,194,.5);animation:inPulse 1.6s ease-in-out infinite;cursor:pointer}
.in-go:hover{transform:translateY(-1px)}
@keyframes inPulse{0%{box-shadow:0 0 0 0 rgba(94,230,255,.55),0 10px 30px rgba(29,95,194,.5)}70%{box-shadow:0 0 0 22px rgba(94,230,255,0),0 10px 30px rgba(29,95,194,.5)}100%{box-shadow:0 0 0 0 rgba(94,230,255,0),0 10px 30px rgba(29,95,194,.5)}}
.in-snd{background:none;border:0;color:#9fb6d6;font-weight:700;font-size:.95rem;font-family:inherit;cursor:pointer;padding:6px 10px;border-radius:10px}.in-snd:hover{background:rgba(255,255,255,.08)}

.uvid video{width:100%;max-width:960px;margin:0 auto;border-radius:16px;display:block;background:#0f1d3a;aspect-ratio:16/9}

/* ---- accessibility ---- */
html.a-fs1{font-size:112.5%}html.a-fs2{font-size:125%}
html.a-hc{--ink:#000;--muted:#1a1a1a;--line:#222}
html.a-hc body{background:#fff!important}
html.a-hc .muted,html.a-hc p,html.a-hc li{color:#000!important}
html.a-hc .card,html.a-hc .ucard,html.a-hc .section,html.a-hc .sim,html.a-hc .eqblock{border:2px solid #000!important;box-shadow:none!important;background:#fff!important}
html.a-hc .btn{outline:2px solid #000;outline-offset:1px}
html.a-hc a{color:#0000c8!important;text-decoration:underline}
html.a-rm *,html.a-rm *::before,html.a-rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

.a11y-bg{position:fixed;inset:0;z-index:9000;background:rgba(10,20,45,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.a11y-card{background:#fff;border-radius:20px;padding:18px 20px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}

.a11y-r>div{display:flex;gap:6px}
.a11y-o{border:2px solid #c9d6ea;background:#f4f7fd;border-radius:12px;padding:6px 14px;font-weight:800;font-family:inherit;font-size:.95rem;color:#13254a;cursor:pointer}
.a11y-o.on{background:#2f6fdb;border-color:#2f6fdb;color:#fff}

/* ---- interactive video ---- */
.uvid .vwrap{position:relative;max-width:960px;margin:0 auto}
.vq{position:absolute;inset:0;border-radius:16px;background:rgba(15,29,58,.82);display:flex;align-items:center;justify-content:center;padding:12px;z-index:3}
.vq-c{background:#fff;border-radius:18px;padding:16px 18px;width:min(560px,100%);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.vq-t{font-weight:800;color:#2f6fdb;font-size:.95rem}.vq-s{font-weight:800;font-size:1.2rem;margin:8px 0 12px;color:#13254a}
.vq-b{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.vq-b .btn{min-width:110px}
.vq-f{margin-top:10px}
@media (max-width:560px){.vq-c{padding:10px 12px}.vq-s{font-size:1rem;margin:4px 0 8px}.vq-t{font-size:.82rem}}

/* ---- reflection ---- */
.refl textarea{width:100%;min-height:62px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-family:inherit;font-size:1rem;resize:vertical;box-sizing:border-box}
.refl label{display:block;font-weight:800;margin:10px 0 4px}
.refl .conf{display:flex;gap:8px;flex-wrap:wrap}.refl .conf button{border:2px solid #c9d6ea;background:#f4f7fd;border-radius:14px;padding:6px 12px;font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.refl .conf button.on{border-color:#2f6fdb;background:#e6efff}
.refl .saved{background:#e3f6ea;border-radius:12px;padding:10px 12px;color:#145c33}

/* ---- objectives & infographic ---- */
.objs{margin:0;padding-inline-start:0;list-style:none;display:grid;gap:8px}
.objs li{display:flex;gap:10px;align-items:flex-start;background:#f4f7fd;border-radius:12px;padding:8px 12px}
.objs li b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,#2f6fdb);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.info{border-radius:20px;overflow:hidden;border:1px solid var(--line)}

.info-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px;background:#f8fafe}
.info-t{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(20,40,90,.07);text-align:center}
.info-t .ic{font-size:2rem;line-height:1}.info-t b{display:block;margin:6px 0 2px;color:#13254a}.info-t span{font-size:.92rem;color:#3b4b66}
.info-m{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px;background:#f8fafe}
.info-m div{border-radius:12px;padding:8px 12px;font-weight:700;font-size:.95rem}.info-m .w{background:#fde8e8;color:#8f1d1d}.info-m .r{background:#e3f6ea;color:#145c33}
@media (max-width:560px){.info-m{grid-template-columns:1fr}}
@media (max-width:700px){.vq{position:static;background:#13254a;border-radius:16px;margin-top:10px;padding:10px}}

   {h:{ar:'النظام المغلق',en:'Closed system'}, review:true, b:{ar:
    '<p>يتحقق الاتزان الكيميائي في نظام مغلق يمنع دخول أو خروج المواد بطريقة تغيّر تركيب النظام المتفاعل. لو هرب غاز ناتج مثلًا، قد يتغير التركيب ولا يبقى النظام في نفس حالة الاتزان.</p>',en:
    '<p>Chemical equilibrium is established in a closed system, which prevents substances entering or leaving in a way that changes the composition. If a product gas escapes, the composition may change and the system may not remain at the same equilibrium.</p>'}},
   {h:{ar:'مبدأ لوشاتيليه',en:"Le Chatelier's principle"}, b:{ar:
    '<p>إذا حدث تغيّر في أحد العوامل المؤثرة على نظام في حالة اتزان (التركيز أو الضغط أو درجة الحرارة)، يُزاح الاتزان في الاتجاه الذي يقلل من تأثير هذا التغيّر.</p><p>النظام <b>لا يلغي</b> التغيّر بالكامل؛ بل يستجيب ويصل إلى اتزان جديد.</p>',en:
    '<p>When a system at equilibrium is subjected to a change in concentration, pressure or temperature, the equilibrium shifts in the direction that tends to oppose the change.</p><p>The system does <b>not</b> cancel the disturbance completely; it responds and establishes a new equilibrium.</p>'}},
   {h:{ar:'تأثير التركيز',en:'Effect of concentration'}, b:{ar:
    '<table class="rules"><tr><th>التغيير</th><th>اتجاه الإزاحة</th></tr><tr><td>زيادة تركيز متفاعل</td><td>طردي (نحو النواتج)</td></tr><tr><td>نقص تركيز متفاعل</td><td>عكسي (نحو المتفاعلات)</td></tr><tr><td>زيادة تركيز ناتج</td><td>عكسي</td></tr><tr><td>نقص تركيز ناتج</td><td>طردي</td></tr></table><p>النظام يستهلك جزءًا من المادة المضافة، أو يعوّض جزءًا من المادة المسحوبة.</p>',en:
    '<table class="rules"><tr><th>Change</th><th>Shift</th></tr><tr><td>Increase a reactant</td><td>Forward (toward products)</td></tr><tr><td>Decrease a reactant</td><td>Backward (toward reactants)</td></tr><tr><td>Increase a product</td><td>Backward</td></tr><tr><td>Decrease a product</td><td>Forward</td></tr></table><p>The system consumes some of an added substance, or replaces some of a removed substance.</p>'}}
  ],
  sims:['dyn'],
  mis:[
   {w:{ar:'عند الاتزان التفاعل يتوقف.',en:'At equilibrium the reaction stops.'}, r:{ar:'التفاعلان مستمران بنفس المعدل (اتزان ديناميكي).',en:'Both reactions continue at equal rates (dynamic).'}, c:'c_dyn'},
   {w:{ar:'تساوي المعدلات يعني تساوي التركيزات.',en:'Equal rates mean equal concentrations.'}, r:{ar:'التركيزات ثابتة لكنها غالبًا غير متساوية.',en:'Concentrations are constant but usually not equal.'}, c:'c_conc'},
   {w:{ar:'النظام يرجع لنفس حالته الأصلية بالضبط بعد الإزاحة.',en:'After a shift the system returns exactly to its original state.'}, r:{ar:'النظام يقلل أثر التغيير ويصل لاتزان جديد.',en:'The system opposes the change and reaches a new equilibrium.'}, c:'c_lec'}
  ],
  quiz:[
   {id:'Q1a', c:'c_dyn', q:{ar:'صح أم خطأ: "عند الاتزان، يتوقف التفاعل الطردي."',en:'True or false: "At equilibrium the forward reaction stops."'}, o:[{ar:'صح',en:'True'},{ar:'خطأ — التفاعل الطردي مستمر بنفس معدل العكسي',en:'False — it continues at the same rate as the backward reaction'}], a:1, x:{ar:'الاتزان ديناميكي.',en:'Equilibrium is dynamic.'}},
   {id:'Q1b', c:'c_lec', q:{ar:'عند إنقاص تركيز أحد المتفاعلات في نظام متزن، يُزاح الاتزان:',en:'Decreasing a reactant concentration shifts equilibrium:'}, o:[{ar:'طرديًا',en:'Forward'},{ar:'عكسيًا',en:'Backward'},{ar:'لا يتأثر',en:'No shift'}], a:1, x:{ar:'النظام يعوّض جزءًا من المتفاعل المسحوب، فيتجه عكسيًا.',en:'The system replaces some of the removed reactant: backward.'}},
   {id:'Q1c', c:'c_lec', q:{ar:'بعد إضافة متفاعل، الاتزان الجديد:',en:'After adding a reactant, the new equilibrium:'}, o:[{ar:'يلغي الإضافة تمامًا ويعود كما كان',en:'Cancels the addition completely'},{ar:'يقلل أثر الإضافة لكن لا يلغيه بالكامل',en:'Reduces the effect but does not cancel it completely'}], a:1, x:{ar:'النظام يقاوم التغيير ويصل لاتزان جديد.',en:'The system opposes the change and settles at a new equilibrium.'}}
  ]
},
{ id:'u2', n:2, color:'green',
  t:{ar:'قانون فعل الكتلة ومعدل التفاعل',en:'Law of mass action & reaction rates'},
  goal:{ar:'كتابة تعبيرات معدل التفاعل الطردي والعكسي واستنتاج تعبير ثابت الاتزان.',en:'Write forward/backward rate expressions and derive the equilibrium-constant expression.'},
  sections:[
   {h:{ar:'المثال المدرسي',en:'The school-level example'}, b:{ar:
    '<div class="eqblock">$FeCl3(aq)+3NH4SCN(aq)<=>Fe(SCN)3(aq)+3NH4Cl(aq)$</div><p>معدل التفاعل الطردي:</p><div class="eqblock">$r_{f}=k_{f}[FeCl3][NH4SCN]^{3}$</div><p>معدل التفاعل العكسي:</p><div class="eqblock">$r_{b}=k_{b}[Fe(SCN)3][NH4Cl]^{3}$</div><p>عند الاتزان $r_{f}=r_{b}$ ، إذن:</p><div class="eqblock">$K_{c}=«k_{f}|k_{b}»=«[Fe(SCN)3][NH4Cl]^{3}|[FeCl3][NH4SCN]^{3}»$</div><ul class="kp"><li>الأقواس المربعة [ ] تعني التركيز.</li><li>$k_{f}$ ثابت معدل التفاعل الطردي، و $k_{b}$ ثابت معدل التفاعل العكسي.</li><li>معاملات المعادلة الموزونة تظهر كأُسس في هذه المعالجة المدرسية.</li></ul><p class="muted">ملحوظة: هذا التعبير المعتمد على المعاملات هو المعالجة المدرسية لهذا المثال، وليس قانون معدل عامًا لكل التفاعلات.</p>',en:
    '<div class="eqblock">$FeCl3(aq)+3NH4SCN(aq)<=>Fe(SCN)3(aq)+3NH4Cl(aq)$</div><p>Forward rate:</p><div class="eqblock">$r_{f}=k_{f}[FeCl3][NH4SCN]^{3}$</div><p>Backward rate:</p><div class="eqblock">$r_{b}=k_{b}[Fe(SCN)3][NH4Cl]^{3}$</div><p>At equilibrium $r_{f}=r_{b}$, so:</p><div class="eqblock">$K_{c}=«k_{f}|k_{b}»=«[Fe(SCN)3][NH4Cl]^{3}|[FeCl3][NH4SCN]^{3}»$</div><ul class="kp"><li>Square brackets mean concentration.</li><li>$k_{f}$ is the forward rate constant; $k_{b}$ the backward rate constant.</li><li>Balanced-equation coefficients appear as powers in this school-level treatment.</li></ul><p class="muted">Note: this coefficient-based expression is the school-level treatment for this example, not a universal rate law.</p>'}},
   {h:{ar:'تجربة اللون',en:'The colour investigation'}, b:{ar:
    '<ul class="kp"><li>إضافة $FeCl3$ (متفاعل) ← إزاحة طردية ← يصبح اللون الأحمر أعمق.</li><li>إضافة $NH4Cl$ (ناتج) ← إزاحة عكسية ← يصبح اللون الأحمر أفتح.</li></ul>',en:
    '<ul class="kp"><li>Adding $FeCl3$ (reactant) → forward shift → deeper red.</li><li>Adding $NH4Cl$ (product) → backward shift → paler red.</li></ul>'}},
   {h:{ar:'منحنى المعدل مع الزمن',en:'Rate–time graph'}, b:{ar:
    '<p>في البداية يكون معدل التفاعل الطردي كبيرًا والعكسي صغيرًا. مع الوقت يقل الطردي ويزداد العكسي حتى يتساويا. عند الاتزان: المعدلان <b>غير صفريين ومتساويان</b> والتفاعل مستمر في الاتجاهين. شاهد ذلك في المحاكاة بالوحدة الأولى.</p>',en:
    '<p>Initially the forward rate is high and the backward rate is low. Over time they approach each other until equal. At equilibrium both rates are <b>non-zero and equal</b>, and the reaction continues both ways. See the Unit 1 simulation.</p>'}}
  ],
  sims:['fescn'],
  mis:[
   {w:{ar:'المعامل يُضرب في التركيز.',en:'The coefficient multiplies the concentration.'}, r:{ar:'المعامل يصبح أسًا للتركيز: $[NH4SCN]^{3}$',en:'The coefficient becomes a power: $[NH4SCN]^{3}$'}, c:'c_mass'}
  ],
  quiz:[
   {id:'Q2a', c:'c_mass', q:{ar:'عند الاتزان يكون:',en:'At equilibrium:'}, o:[{ar:'$r_{f}=r_{b}$ و $K_{c}=«k_{f}|k_{b}»$',en:'$r_{f}=r_{b}$ and $K_{c}=«k_{f}|k_{b}»$'},{ar:'$r_{f}=0$',en:'$r_{f}=0$'},{ar:'$K_{c}=k_{f}×k_{b}$',en:'$K_{c}=k_{f}×k_{b}$'}], a:0, x:{ar:'تساوي المعدلين يعطي النسبة $«k_{f}|k_{b}»$.',en:'Equal rates give the ratio $«k_{f}|k_{b}»$.'}},
   {id:'Q2b', c:'c_lec', q:{ar:'في خليط الاتزان الأحمر للتفاعل: $FeCl3(aq)+3NH4SCN(aq)<=>Fe(SCN)3(aq)+3NH4Cl(aq)$ عند إضافة $NH4Cl$ يصبح اللون:',en:'In the red equilibrium mixture of $FeCl3(aq)+3NH4SCN(aq)<=>Fe(SCN)3(aq)+3NH4Cl(aq)$, adding $NH4Cl$ makes the colour:'}, o:[{ar:'أحمر أعمق',en:'Deeper red'},{ar:'أحمر أفتح',en:'Paler red'},{ar:'لا يتغير',en:'Unchanged'}], a:1, x:{ar:'$NH4Cl$ ناتج ← إزاحة عكسية ← لون أفتح.',en:'$NH4Cl$ is a product → backward shift → paler.'}}
  ]
},
{ id:'u3', n:3, color:'purple',
  t:{ar:'ثابت الاتزان Kc',en:'The equilibrium constant Kc'},
  goal:{ar:'كتابة تعبير Kc من المعادلة الموزونة، واستبعاد المواد الصلبة والسائلة النقية.',en:'Construct Kc from a balanced equation and omit pure solids and liquids.'},
  sections:[
   {h:{ar:'التعبير العام',en:'General expression'}, b:{ar:
    '<div class="eqblock">$aA+bB<=>cC+dD$ &nbsp;&nbsp;&nbsp; $K_{c}=«[C]^{c}[D]^{d}|[A]^{a}[B]^{b}»$</div><ol><li>النواتج في البسط.</li><li>المتفاعلات في المقام.</li><li>معامل كل مادة يصبح أسًا.</li><li>لا تُكتب المواد الصلبة النقية والسوائل النقية.</li><li>عوّض بتركيزات الاتزان واعرض خطوات الحساب.</li></ol>',en:
    '<div class="eqblock">$aA+bB<=>cC+dD$ &nbsp;&nbsp;&nbsp; $K_{c}=«[C]^{c}[D]^{d}|[A]^{a}[B]^{b}»$</div><ol><li>Products in the numerator.</li><li>Reactants in the denominator.</li><li>Each coefficient becomes a power.</li><li>Omit pure solids and pure liquids.</li><li>Substitute equilibrium concentrations and show the arithmetic.</li></ol>'}},
   {h:{ar:'لماذا لا نكتب الصلب والسائل النقي؟',en:'Why omit pure solids and liquids?'}, review:true, b:{ar:
    '<p>تركيز المادة الصلبة النقية أو السائلة النقية يظل ثابتًا تقريبًا طالما هذه المادة موجودة، فيُدمج أثره الثابت داخل قيمة ثابت الاتزان ولا يُكتب كحد متغير.</p>',en:
    '<p>The concentration of a pure solid or pure liquid stays effectively constant while that phase is present, so its constant contribution is incorporated into K and not written as a variable term.</p>'}},
   {h:{ar:'رموز الحالة',en:'State symbols'}, b:{ar:
    '<p><b>(s)</b> صلب · <b>(l)</b> سائل · <b>(g)</b> غاز · <b>(aq)</b> محلول مائي · <b>(v)</b> بخار. البخار حالة غازية فيُكتب في التعبير، بينما السائل النقي لا يُكتب.</p>',en:
    '<p><b>(s)</b> solid · <b>(l)</b> liquid · <b>(g)</b> gas · <b>(aq)</b> aqueous · <b>(v)</b> vapour. Vapour is gaseous and is included; a pure liquid is omitted.</p>'}},
   {h:{ar:'أمثلة',en:'Examples'}, b:{ar:
    '<div class="eqblock">$2H2O(v)<=>2H2(g)+O2(g)$ &nbsp; ⟹ &nbsp; $K_{c}=«[H2]^{2}[O2]|[H2O]^{2}»$</div><div class="eqblock">$NH3(l)<=>NH3(g)$ &nbsp; ⟹ &nbsp; $K_{c}=[NH3]$</div><div class="eqblock">$3I2(s)+3H2O(l)<=>5I^{-}(aq)+IO3^{-}(aq)+6H^{+}(aq)$ &nbsp; ⟹ &nbsp; $K_{c}=[I^{-}]^{5}[IO3^{-}][H^{+}]^{6}$</div>',en:
    '<div class="eqblock">$2H2O(v)<=>2H2(g)+O2(g)$ &nbsp; ⟹ &nbsp; $K_{c}=«[H2]^{2}[O2]|[H2O]^{2}»$</div><div class="eqblock">$NH3(l)<=>NH3(g)$ &nbsp; ⟹ &nbsp; $K_{c}=[NH3]$</div><div class="eqblock">$3I2(s)+3H2O(l)<=>5I^{-}(aq)+IO3^{-}(aq)+6H^{+}(aq)$ &nbsp; ⟹ &nbsp; $K_{c}=[I^{-}]^{5}[IO3^{-}][H^{+}]^{6}$</div>'}},
   {h:{ar:'دلالة قيمة Kc',en:'Meaning of Kc'}, review:true, b:{ar:
    '<p>$K_{c}$ يصف تركيب خليط الاتزان عند درجة حرارة محددة. القيمة <b>الكبيرة جدًا</b> تدل عمومًا على أن النواتج هي السائدة، والقيمة <b>الصغيرة جدًا</b> تدل على أن المتفاعلات هي السائدة. قيمة K لا تدل على سرعة التفاعل.</p>',en:
    '<p>$K_{c}$ describes the equilibrium composition at a specified temperature. A <b>very large</b> value generally indicates product-favoured; a <b>very small</b> value reactant-favoured. K says nothing about how fast a reaction is.</p>'}},
   {h:{ar:'هل الخليط في حالة اتزان؟',en:'Is the mixture at equilibrium?'}, b:{ar:
    '<p>احسب قيمة التعبير باستخدام تركيزات الخليط الحالية، وقارنها بقيمة $K_{c}$ المعطاة <b>عند نفس درجة الحرارة</b>. إذا اختلفت القيمتان فالخليط ليس في حالة اتزان.</p>',en:
    '<p>Calculate the expression using the current concentrations and compare with the stated $K_{c}$ <b>at the same temperature</b>. If they differ, the mixture is not at equilibrium.</p>'}},
   {h:{ar:'عكس المعادلة وضربها',en:'Reversing and multiplying'}, b:{ar:
    '<div class="eqblock">$K_{reverse}=«1|K_{forward}»$ &nbsp;&nbsp;&nbsp; $K_{new}=(K_{original})^{n}$</div><p>عند عكس المعادلة يصبح الثابت مقلوب الثابت الأصلي، وعند ضرب كل المعاملات في n يُرفع الثابت للأس n.</p>',en:
    '<div class="eqblock">$K_{reverse}=«1|K_{forward}»$ &nbsp;&nbsp;&nbsp; $K_{new}=(K_{original})^{n}$</div><p>Reversing gives the reciprocal; multiplying all coefficients by n raises K to the power n.</p>'}},
   {h:{ar:'مثال عددي: تكوين يوديد الهيدروجين',en:'Worked example: forming hydrogen iodide'}, newrev:true, b:{ar:
    '<div class="eqblock">$H2(g)+I2(g)<=>2HI(g)$ &nbsp;&nbsp; $K_{c}=«[HI]^{2}|[H2][I2]»=50$</div><p><b>دلالة القيمة:</b> $K_{c}=50$ أكبر من 1، فعند الاتزان تكون نسبة النواتج كبيرة مقارنة بالمتفاعلات عند درجة الحرارة المحددة.</p><p><b>مثال 1 — احسب $K_{c}$:</b> عند الاتزان $[HI]=0.500 mol/L$ و $[H2]=0.050 mol/L$ و $[I2]=0.100 mol/L$.</p><div class="eqblock">$K_{c}=«(0.500)^{2}|(0.050)(0.100)»=«0.250|0.005»=50.000$</div><p><b>مثال 2 — احسب $[HI]$:</b> عند الاتزان $[H2]=[I2]=0.100 mol/L$.</p><div class="eqblock">$[HI]^{2}=50×0.100×0.100=0.500$ ⟹ $[HI]=0.707 mol/L$</div><ul class="kp"><li>قرّب الناتج النهائي لأقرب <b>3 أرقام عشرية</b>.</li><li>عوّض بتركيزات <b>الاتزان</b> فقط، واكتب خطوات الحساب.</li></ul>',en:
    '<div class="eqblock">$H2(g)+I2(g)<=>2HI(g)$ &nbsp;&nbsp; $K_{c}=«[HI]^{2}|[H2][I2]»=50$</div><p><b>Meaning:</b> $K_{c}=50$ is greater than 1, so at equilibrium the proportion of products is large compared with reactants at the specified temperature.</p><p><b>Example 1 — find $K_{c}$:</b> at equilibrium $[HI]=0.500 mol/L$, $[H2]=0.050 mol/L$, $[I2]=0.100 mol/L$.</p><div class="eqblock">$K_{c}=«(0.500)^{2}|(0.050)(0.100)»=«0.250|0.005»=50.000$</div><p><b>Example 2 — find $[HI]$:</b> at equilibrium $[H2]=[I2]=0.100 mol/L$.</p><div class="eqblock">$[HI]^{2}=50×0.100×0.100=0.500$ ⟹ $[HI]=0.707 mol/L$</div><ul class="kp"><li>Round the final answer to <b>3 decimal places</b>.</li><li>Substitute <b>equilibrium</b> concentrations only and show the working.</li></ul>'}}
  ],
  sims:['kc'],
  mis:[
   {w:{ar:'كل المواد تُكتب في تعبير Kc.',en:'Every substance appears in Kc.'}, r:{ar:'المواد الصلبة النقية والسوائل النقية لا تُكتب.',en:'Pure solids and pure liquids are omitted.'}, c:'c_phase'},
   {w:{ar:'المعامل يُكتب كرقم مضروب.',en:'The coefficient is written as a multiplier.'}, r:{ar:'المعامل يصبح أسًا.',en:'The coefficient becomes a power.'}, c:'c_kc'},
   {w:{ar:'بخار الماء (v) يُعامل كسائل ويُحذف.',en:'Water vapour (v) is treated as a liquid and omitted.'}, r:{ar:'البخار غاز ويُكتب في التعبير.',en:'Vapour is a gas and is included.'}, c:'c_phase'}
  ],
  quiz:[
   {id:'Q3a', c:'c_phase', q:{ar:'تعبير $K_{c}$ للتفاعل $NH3(l)<=>NH3(g)$ هو:',en:'The $K_{c}$ for $NH3(l)<=>NH3(g)$ is:'}, o:[{ar:'$K_{c}=«[NH3(g)]|[NH3(l)]»$',en:'$K_{c}=«[NH3(g)]|[NH3(l)]»$'},{ar:'$K_{c}=[NH3]$',en:'$K_{c}=[NH3]$'},{ar:'$K_{c}=1$',en:'$K_{c}=1$'}], a:1, x:{ar:'السائل النقي لا يُكتب.',en:'The pure liquid is omitted.'}},
   {id:'Q3b', c:'c_kc', q:{ar:'في تعبير $K_{c}$، معامل المادة في المعادلة الموزونة:',en:'In a $K_{c}$ expression, a substance’s coefficient:'}, o:[{ar:'يُضرب في التركيز',en:'Multiplies the concentration'},{ar:'يصبح أسًا للتركيز',en:'Becomes the power of the concentration'},{ar:'يُهمل',en:'Is ignored'}], a:1, x:{ar:'مثال: $[H2]^{2}$',en:'Example: $[H2]^{2}$'}},
   {id:'Q3c', c:'c_kc', q:{ar:'للتفاعل $H2(g)+I2(g)<=>2HI(g)$ قيمة $K_{c}=50$. إذا كان عند الاتزان $[H2]=[I2]=0.100 mol/L$ فإن $[HI]$ يساوي:',en:'For $H2(g)+I2(g)<=>2HI(g)$, $K_{c}=50$. If at equilibrium $[H2]=[I2]=0.100 mol/L$, then $[HI]$ equals:'}, o:[{ar:'0.707 mol/L',en:'0.707 mol/L'},{ar:'0.500 mol/L',en:'0.500 mol/L'},{ar:'5.000 mol/L',en:'5.000 mol/L'},{ar:'0.071 mol/L',en:'0.071 mol/L'}], a:0, x:{ar:'$[HI]^{2}=50×0.100×0.100=0.500$ ، إذن $[HI]=0.707$',en:'$[HI]^{2}=50×0.100×0.100=0.500$, so $[HI]=0.707$'}}
  ]
},
{ id:'u4', n:4, color:'blue',
  t:{ar:'درجة الحرارة والاتزان',en:'Temperature and equilibrium'},
  goal:{ar:'التنبؤ بأثر تغيير درجة الحرارة على موضع الاتزان وقيمة K.',en:'Predict how temperature affects equilibrium position and K.'},
  sections:[
   {h:{ar:'تمثيل الحرارة',en:'Representing heat'}, b:{ar:
    '<p>في التفاعل <b>الطارد</b> للحرارة تُكتب الحرارة مع النواتج، و $ΔH$ سالبة. في التفاعل <b>الماص</b> تُكتب الحرارة مع المتفاعلات، و $ΔH$ موجبة.</p>',en:
    '<p>For an <b>exothermic</b> forward reaction heat is written with the products and $ΔH$ is negative. For an <b>endothermic</b> one, heat is on the reactant side and $ΔH$ is positive.</p>'}},
   {h:{ar:'قواعد الإزاحة',en:'Shift rules'}, b:{ar:
    '<table class="rules"><tr><th>التفاعل الطردي</th><th>رفع الحرارة</th><th>خفض الحرارة</th></tr><tr><td>طارد للحرارة</td><td>إزاحة عكسية</td><td>إزاحة طردية</td></tr><tr><td>ماص للحرارة</td><td>إزاحة طردية</td><td>إزاحة عكسية</td></tr></table>',en:
    '<table class="rules"><tr><th>Forward reaction</th><th>Raise T</th><th>Lower T</th></tr><tr><td>Exothermic</td><td>Backward</td><td>Forward</td></tr><tr><td>Endothermic</td><td>Forward</td><td>Backward</td></tr></table>'}},
   {h:{ar:'درجة الحرارة وثابت الاتزان',en:'Temperature and K'}, review:true, b:{ar:
    '<ul class="kp"><li>رفع الحرارة <b>يقلل</b> $K_{c}$ للتفاعل الطارد، و<b>يزيد</b> $K_{c}$ للتفاعل الماص.</li><li>تغيير التركيز عند ثبوت الحرارة لا يغير $K_{c}$.</li></ul><p>ثوابت المعدل $k_{f}$ و $k_{b}$ تعتمد على درجة الحرارة، والنسبة بينهما هي $K_{c}$؛ لذلك تغيير الحرارة يغير $K_{c}$ نفسه، بينما تغيير التركيز يزيح الاتزان دون تغيير $K_{c}$.</p>',en:
    '<ul class="kp"><li>Raising T <b>decreases</b> $K_{c}$ for an exothermic reaction and <b>increases</b> it for an endothermic one.</li><li>Changing concentration at constant T does not change $K_{c}$.</li></ul><p>The rate constants $k_{f}$ and $k_{b}$ depend on temperature and their ratio is $K_{c}$; so temperature changes K itself, while concentration changes only shift the position.</p>'}},
   {h:{ar:'الحرارة ومعدل التفاعل',en:'Temperature and rate'}, b:{ar:
    '<p>التسخين يزيد معدل التفاعلين الطردي والعكسي فيصل النظام للاتزان أسرع. هذا تأثير <b>منفصل</b> عن قاعدة إزاحة الموضع نحو الاتجاه الماص للحرارة.</p>',en:
    '<p>Heating increases both forward and backward rates, so equilibrium is reached faster. This is <b>separate</b> from the rule that the position shifts toward the endothermic direction.</p>'}},
   {h:{ar:'مثال: تحضير النشادر',en:'Example: ammonia synthesis'}, review:true, b:{ar:
    '<div class="eqblock">$N2(g)+3H2(g)<=>2NH3(g)+Heat$ &nbsp; <bdi>($ΔH=-92 kJ$)</bdi></div><ul class="kp"><li>رفع الحرارة ← إزاحة عكسية ← يقل ناتج النشادر عند الاتزان.</li><li>خفض الحرارة ← إزاحة طردية ← يزيد ناتج النشادر.</li></ul>',en:
    '<div class="eqblock">$N2(g)+3H2(g)<=>2NH3(g)+Heat$ &nbsp; <bdi>($ΔH=-92 kJ$)</bdi></div><ul class="kp"><li>Raising T → backward shift → lower equilibrium yield of NH₃.</li><li>Lowering T → forward shift → higher yield.</li></ul>'}},
   {h:{ar:'مثال: NO₂ / N₂O₄',en:'Example: NO₂ / N₂O₄'}, b:{ar:
    '<div class="eqblock">$2NO2(g)<=>N2O4(g)+Heat$</div><p>NO₂ بني محمر و N₂O₄ عديم اللون. التسخين يفضّل الاتجاه العكسي الماص فيزيد NO₂ البني، والتبريد يفضّل الاتجاه الطردي الطارد فيزيد N₂O₄.</p>',en:
    '<div class="eqblock">$2NO2(g)<=>N2O4(g)+Heat$</div><p>NO₂ is reddish-brown and N₂O₄ colourless. Heating favours the endothermic reverse direction (more brown NO₂); cooling favours the exothermic forward direction (more N₂O₄).</p>'}}

{ id:'u5', n:5, color:'green',

  sections:[
   {h:{ar:'الضغط والحجم',en:'Pressure and volume'}, b:{ar:
    '<p>لكمية ثابتة من الغاز عند ثبوت درجة الحرارة: تقليل الحجم يزيد الضغط، وزيادة الحجم تقلل الضغط.</p>',en:
    '<p>For a fixed amount of gas at constant temperature, decreasing volume increases pressure; increasing volume decreases pressure.</p>'}},
   {h:{ar:'أثر الضغط على الاتزان',en:'Effect on equilibrium'}, b:{ar:
    '<ul class="kp"><li>زيادة الضغط (تقليل الحجم) ← إزاحة نحو الجانب ذي <b>عدد المولات الغازية الأقل</b>.</li><li>تقليل الضغط (زيادة الحجم) ← إزاحة نحو الجانب ذي عدد المولات الغازية الأكبر.</li><li>إذا تساوى عدد المولات الغازية في الجانبين لا يُزاح موضع الاتزان.</li><li>احسب المولات <b>الغازية فقط</b> (لا تحسب الصلب أو السائل أو المحلول المائي).</li></ul><p>الانضغاط يرفع الضغط، والإزاحة نحو جزيئات غازية أقل تقاوم هذه الزيادة.</p><p><b>"لا إزاحة" لا تعني "لا تغيير"</b>: الانضغاط يزيد تركيزات الغازات حتى لو لم يتغير الموضع. وتغيير الضغط عند ثبوت الحرارة لا يغير $K_{c}$ أو $K_{p}$.</p>',en:
    '<ul class="kp"><li>Increasing pressure (smaller volume) → shift toward <b>fewer gas moles</b>.</li><li>Decreasing pressure (larger volume) → shift toward more gas moles.</li><li>Equal gas moles on both sides → no shift in position.</li><li>Count <b>gaseous species only</b> (not solids, liquids or aqueous species).</li></ul><p>Compression raises pressure; a shift toward fewer gas molecules tends to oppose it.</p><p><b>"No shift" does not mean "nothing changes"</b>: compression still raises gas concentrations. Pressure changes at constant T do not change $K_{c}$ or $K_{p}$.</p>'}},
   {h:{ar:'أمثلة',en:'Examples'}, b:{ar:
    '<div class="eqblock">$N2(g)+3H2(g)<=>2NH3(g)$ &nbsp; <bdi>(4 مولات ← 2 مول)</bdi></div><p>زيادة الضغط تفضّل النواتج، وتقليله يفضّل المتفاعلات.</p><div class="eqblock">$CO(g)+NO2(g)<=>CO2(g)+NO(g)$ &nbsp; <bdi>(2 = 2)</bdi></div><p>لا إزاحة في الموضع، لكن التركيزات والضغوط الجزئية تتغير.</p>',en:
    '<div class="eqblock">$N2(g)+3H2(g)<=>2NH3(g)$ &nbsp; (4 mol → 2 mol)</div><p>Higher pressure favours products; lower pressure favours reactants.</p><div class="eqblock">$CO(g)+NO2(g)<=>CO2(g)+NO(g)$ &nbsp; (2 = 2)</div><p>No shift, but concentrations and partial pressures change.</p>'}},
   {h:{ar:'الضغط الجزئي و Kp',en:'Partial pressure and Kp'}, b:{ar:
    '<p>الضغط الجزئي هو مساهمة غاز واحد في ضغط الخليط.</p><div class="eqblock">$P_{total}=P_{1}+P_{2}+...+P_{n}$ </div><p>مثال: $2+5+7=14 atm$</p><div class="eqblock">$K_{p}=«(P_{C})^{c}(P_{D})^{d}|(P_{A})^{a}(P_{B})^{b}»$</div><p><b>مثال محلول:</b> للتفاعل $N2(g)+2O2(g)<=>2NO2(g)$ ، $P_{N2}=0.2 atm$ و $P_{O2}=1 atm$ و $P_{NO2}=2 atm$:</p><div class="eqblock">$K_{p}=«(P_{NO2})^{2}|P_{N2}(P_{O2})^{2}»=«(2)^{2}|(0.2)(1)^{2}»=20$</div>',en:
    '<p>A partial pressure is one gas’s contribution to the mixture’s pressure.</p><div class="eqblock">$P_{total}=P_{1}+P_{2}+...+P_{n}$ &nbsp;&nbsp; e.g. $2+5+7=14 atm$</div><div class="eqblock">$K_{p}=«(P_{C})^{c}(P_{D})^{d}|(P_{A})^{a}(P_{B})^{b}»$</div><p><b>Worked example:</b> for $N2(g)+2O2(g)<=>2NO2(g)$ with $P_{N2}=0.2$, $P_{O2}=1$, $P_{NO2}=2$ atm:</p><div class="eqblock">$K_{p}=«(P_{NO2})^{2}|P_{N2}(P_{O2})^{2}»=«(2)^{2}|(0.2)(1)^{2}»=20$</div>'}}
  ],
  sims:['piston','kp'],

   {w:{ar:'نحسب كل المولات في المعادلة.',en:'Count all moles in the equation.'}, r:{ar:'نحسب المولات الغازية فقط.',en:'Count gaseous moles only.'}, c:'c_pres'}

/* ============ SIMULATIONS (conceptual / illustrative) ============ */
const SIMS = {};
const illTag = () => `<span class="tag ill">${T({ar:'نموذج مفاهيمي توضيحي — ليس بيانات مقاسة',en:'Conceptual / illustrative — not measured data'})}</span>`;
function simShell(title, body){ return `<div class="sim"><div class="simhead"><h3>${title}</h3>${illTag()}</div>${body}</div>`; }
function rnd(a,b){return a+Math.random()*(b-a)}
function fitCanvas(cv){ const r=window.devicePixelRatio||1, w=cv.width, h=cv.height; cv.style.width='100%'; cv.style.maxWidth=Math.round(w*1.35)+'px'; cv.style.aspectRatio=w+'/'+h; cv.width=w*r; cv.height=h*r; const c=cv.getContext('2d'); c.scale(r,r); return {c,w,h}; }

SIMS.dyn = (root)=>{
  root.innerHTML = simShell(T({ar:'من بداية التفاعل إلى الاتزان — ومعمل التركيز',en:'From reaction start to equilibrium — concentration lab'}), `
  <p class="muted">${T({ar:'الجسيمات الزرقاء = متفاعل A ، والبرتقالية = ناتج B. اضغط تشغيل وراقب المعدلين والتركيزين. بعد الوصول للاتزان جرّب تغيير التركيز وتوقّع اتجاه الإزاحة.',en:'Blue = reactant A, orange = product B. Press play and watch the two rates and concentrations. After equilibrium, disturb the system and predict the shift.'})}</p>
  <div class="simgrid">
    <div><canvas id="dP" width="460" height="300"></canvas>
      <div class="legend" style="margin-top:6px"><span><i style="background:#2f7be6;border-radius:50%"></i>A</span><span><i style="background:#f08a24"></i>B</span><span>${chem('$A<=>B$')}</span></div></div>
    <div>
      <div class="counter"><div style="color:#1d5fc2">${T({ar:'تحولات طردية',en:'Forward events'})}<br><span id="dF">0</span></div><div style="color:#c96a10">${T({ar:'تحولات عكسية',en:'Backward events'})}<br><span id="dB">0</span></div></div>
      <div style="font-weight:700;font-size:.9rem">${T({ar:'المعدل مع الزمن',en:'Rate vs time'})}</div><canvas id="dR" width="320" height="130"></canvas>
      <div style="font-weight:700;font-size:.9rem;margin-top:6px">${T({ar:'التركيز مع الزمن',en:'Concentration vs time'})}</div><canvas id="dC" width="320" height="130"></canvas>
      <div class="legend"><span><i style="background:#2f7be6"></i>${T({ar:'طردي / [A]',en:'forward / [A]'})}</span><span><i style="background:#f08a24"></i>${T({ar:'عكسي / [B]',en:'backward / [B]'})}</span></div>
    </div>
  </div>
  <div class="ctrls"><button class="btn blue sm" id="dGo">${T({ar:'▶ تشغيل',en:'▶ Play'})}</button><button class="btn ghost sm" id="dReset">${T({ar:'↺ إعادة',en:'↺ Reset'})}</button></div>
  <div class="ctrls" id="dDist">
    <button class="btn ghost sm" data-a="addA">+ ${T({ar:'إضافة متفاعل A',en:'Add reactant A'})}</button>
    <button class="btn ghost sm" data-a="remA">− ${T({ar:'سحب متفاعل A',en:'Remove reactant A'})}</button>
    <button class="btn ghost sm" data-a="addB">+ ${T({ar:'إضافة ناتج B',en:'Add product B'})}</button>
    <button class="btn ghost sm" data-a="remB">− ${T({ar:'سحب ناتج B',en:'Remove product B'})}</button>
  </div>
  <div id="dPred"></div><div id="dFb"></div>`);
  const P=fitCanvas(root.querySelector('#dP')), R=fitCanvas(root.querySelector('#dR')), C=fitCanvas(root.querySelector('#dC'));
  const pf=0.022, pb=0.011; let parts=[], run=false, rf=0, rb=0, hist=[], marks=[], raf, acc=0, last=0, totF=0, totB=0, tick=0;
  const mk=s=>({x:rnd(12,P.w-12),y:rnd(12,P.h-12),vx:rnd(-1,1),vy:rnd(-1,1),s,fl:0});
  function reset(){parts=[];for(let i=0;i<54;i++)parts.push(mk('A'));rf=rb=0;hist=[];marks=[];totF=totB=0;tick=0;run=false;root.querySelector('#dGo').textContent=T({ar:'▶ تشغيل',en:'▶ Play'});root.querySelector('#dPred').innerHTML='';root.querySelector('#dFb').innerHTML='';draw();}
  function step(){ let f=0,b=0; for(const p of parts){ if(p.s==='A'&&Math.random()<pf){p.s='B';p.fl=8;f++} else if(p.s==='B'&&Math.random()<pb){p.s='A';p.fl=8;b++} }
    totF+=f;totB+=b; rf=rf*.93+f*.07; rb=rb*.93+b*.07; tick++;
    const nA=parts.filter(p=>p.s==='A').length; hist.push([rf,rb,nA,parts.length-nA]); if(hist.length>320){hist.shift();marks=marks.map(m=>m-1).filter(m=>m>=0)} }
  function move(){ for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.x<8||p.x>P.w-8)p.vx*=-1;if(p.y<8||p.y>P.h-8)p.vy*=-1;p.x=Math.max(8,Math.min(P.w-8,p.x));p.y=Math.max(8,Math.min(P.h-8,p.y));if(p.fl)p.fl--;} }
  function graph(G,i1,i2,max){ const c=G.c; c.clearRect(0,0,G.w,G.h); c.strokeStyle='#c9d6ea'; c.lineWidth=1; c.beginPath(); c.moveTo(24,6); c.lineTo(24,G.h-16); c.lineTo(G.w-4,G.h-16); c.stroke();
    c.fillStyle='#8a99b2'; c.font='10px Inter'; c.fillText(T({ar:'الزمن',en:'time'}),G.w-36,G.h-4);
    const n=hist.length; if(!n)return; const sx=(G.w-30)/320, sy=(G.h-26)/max;
    for(const m of marks){c.strokeStyle='#f2b33d';c.setLineDash([4,3]);c.beginPath();c.moveTo(25+m*sx,6);c.lineTo(25+m*sx,G.h-16);c.stroke();c.setLineDash([])}
    [[i1,'#2f7be6'],[i2,'#f08a24']].forEach(([k,col])=>{c.strokeStyle=col;c.lineWidth=2.2;c.beginPath();hist.forEach((h,j)=>{const x=25+j*sx,y=G.h-17-h[k]*sy; j?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();}); }
  function draw(){ const c=P.c; c.clearRect(0,0,P.w,P.h);
    for(const p of parts){ if(p.fl){c.strokeStyle='rgba(242,179,61,'+(p.fl/8)+')';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,11,0,7);c.stroke()}
      if(p.s==='A'){c.fillStyle='#2f7be6';c.beginPath();c.arc(p.x,p.y,6,0,7);c.fill()} else {c.fillStyle='#f08a24';c.beginPath();c.roundRect?c.roundRect(p.x-6,p.y-6,12,12,3):c.rect(p.x-6,p.y-6,12,12);c.fill()} }
    const mr=Math.max(1.6, ...hist.map(h=>Math.max(h[0],h[1])));
    graph(R,0,1,mr*1.1); graph(C,2,3,Math.max(60,parts.length)*1.05);
    root.querySelector('#dF').textContent=totF; root.querySelector('#dB').textContent=totB; }
  function loop(t){ raf=requestAnimationFrame(loop); if(!run){return} const dt=t-last; last=t; acc+=Math.min(dt,100); move(); while(acc>55){step();acc-=55} draw(); }
  root.querySelector('#dGo').onclick=()=>{ run=!run; last=performance.now(); root.querySelector('#dGo').textContent=run?T({ar:'❚❚ إيقاف',en:'❚❚ Pause'}):T({ar:'▶ تشغيل',en:'▶ Play'}); logEv('sim','dyn:'+(run?'play':'pause')); };
  root.querySelector('#dReset').onclick=()=>{reset();logEv('sim','dyn:reset')};
  const expect={addA:'f',remA:'b',addB:'b',remB:'f'};
  const why={addA:{ar:'أضفنا متفاعلًا، فيزداد معدل التفاعل الطردي مؤقتًا ويستهلك النظام جزءًا من A المضاف ← إزاحة طردية.',en:'Adding reactant raises the forward rate temporarily; the system consumes some added A → forward shift.'},
    remA:{ar:'سحبنا متفاعلًا، فيقل المعدل الطردي مؤقتًا ويعوّض النظام جزءًا من A ← إزاحة عكسية.',en:'Removing reactant lowers the forward rate; the system replaces some A → backward shift.'},
    addB:{ar:'أضفنا ناتجًا، فيزداد المعدل العكسي مؤقتًا ويستهلك النظام جزءًا من B ← إزاحة عكسية.',en:'Adding product raises the backward rate; the system consumes some B → backward shift.'},
    remB:{ar:'سحبنا ناتجًا، فيقل المعدل العكسي مؤقتًا ويعوّض النظام جزءًا من B ← إزاحة طردية.',en:'Removing product lowers the backward rate; the system replaces some B → forward shift.'}};
  root.querySelectorAll('#dDist button').forEach(b=>b.onclick=()=>{
    if(tick<60){ root.querySelector('#dFb').innerHTML=`<div class="fb no">${T({ar:'شغّل المحاكاة أولًا واستنى لحد ما المعدلين يتساووا تقريبًا (الاتزان).',en:'Run the simulation first and wait until the rates are about equal (equilibrium).'})}</div>`; return;}
    const a=b.dataset.a; run=false; root.querySelector('#dGo').textContent=T({ar:'▶ تشغيل',en:'▶ Play'});
    root.querySelector('#dFb').innerHTML='';
    root.querySelector('#dPred').innerHTML=`<div class="predict"><b>${T({ar:'توقّع قبل ما نطبّق: الاتزان هيتزاح ناحية؟',en:'Predict first: which way will equilibrium shift?'})}</b><div class="ctrls"><button class="btn blue sm" data-p="f">${T({ar:'طردي (نحو B)',en:'Forward (toward B)'})}</button><button class="btn ghost sm" data-p="b">${T({ar:'عكسي (نحو A)',en:'Backward (toward A)'})}</button></div></div>`;
    root.querySelectorAll('#dPred [data-p]').forEach(pb2=>pb2.onclick=()=>{
      const ok=pb2.dataset.p===expect[a];
      if(a==='addA'){for(let i=0;i<16&&parts.length<130;i++)parts.push(mk('A'))}
      if(a==='addB'){for(let i=0;i<16&&parts.length<130;i++)parts.push(mk('B'))}
      if(a==='remA'||a==='remB'){const s=a==='remA'?'A':'B';let k=0;parts=parts.filter(p=>{if(p.s===s&&k<14){k++;return false}return true})}
      marks.push(hist.length-1);
      root.querySelector('#dPred').innerHTML='';
      root.querySelector('#dFb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?T({ar:'✔ توقّع صحيح! ',en:'✔ Correct prediction! '}):T({ar:'✘ مش بالظبط. ',en:'✘ Not quite. '})}${T(why[a])}<br>${T({ar:'لاحظ: التفاعلان لسه شغالين، والنظام بيوصل لاتزان جديد — مش بيرجع لنفس الحالة الأصلية.',en:'Note: both reactions keep running and the system reaches a new equilibrium — not the original state.'})}</div>`;
      logEv('sim',`dyn:${a}:predict=${pb2.dataset.p}:${ok?'correct':'wrong'}`);
      run=true; last=performance.now(); root.querySelector('#dGo').textContent=T({ar:'❚❚ إيقاف',en:'❚❚ Pause'});
    });
  });
  reset(); raf=requestAnimationFrame(loop);
  return ()=>cancelAnimationFrame(raf);
};

 {id:'r1',sp:[{f:'H2O',ph:'v',co:2,s:'R'},{f:'H2',ph:'g',co:2,s:'P'},{f:'O2',ph:'g',co:1,s:'P'}]},

 {id:'r3',sp:[{f:'I2',ph:'s',co:3,s:'R'},{f:'H2O',ph:'l',co:3,s:'R'},{f:'I^{-}',ph:'aq',co:5,s:'P'},{f:'IO3^{-}',ph:'aq',co:1,s:'P'},{f:'H^{+}',ph:'aq',co:6,s:'P'}]},
 {id:'r4',sp:[{f:'N2',ph:'g',co:1,s:'R'},{f:'H2',ph:'g',co:3,s:'R'},{f:'NH3',ph:'g',co:2,s:'P'}]},
 {id:'r5',sp:[{f:'FeCl3',ph:'aq',co:1,s:'R'},{f:'NH4SCN',ph:'aq',co:3,s:'R'},{f:'Fe(SCN)3',ph:'aq',co:1,s:'P'},{f:'NH4Cl',ph:'aq',co:3,s:'P'}]}

function rxEq(r){const side=s=>r.sp.filter(x=>x.s===s).map(x=>(x.co>1?x.co:'')+x.f+'('+x.ph+')').join('+');return side('R')+'<=>'+side('P')}
function term(x){return '['+x.f+']'+(x.co>1?'^{'+x.co+'}':'')}
function kexpr(num,den){const n=num.map(term).join('')||'1';return den.length?'$K_{c}=«'+n+'|'+den.map(term).join('')+'»$':'$K_{c}='+n+'$'}
SIMS.kc=(root)=>{
  let cur=0;
  root.innerHTML=simShell(T({ar:'مُنشئ تعبير ثابت الاتزان Kc',en:'Kc expression builder'}),`<div class="tabs" id="kTabs">${KC_RX.map((r,i)=>`<button data-i="${i}">${T({ar:'تفاعل',en:'Reaction'})} ${i+1}</button>`).join('')}</div><div id="kBody"></div>`);
  root.querySelector('#kBody').addEventListener('change',e=>{if(e.target.tagName==='SELECT')preview()});
  const opts=()=>`<option value="">—</option><option value="n">${T({ar:'في البسط',en:'Numerator'})}</option><option value="d">${T({ar:'في المقام',en:'Denominator'})}</option><option value="o">${T({ar:'لا يُكتب',en:'Omit'})}</option>`;
  function show(i){cur=i; root.querySelectorAll('#kTabs button').forEach((b,j)=>b.classList.toggle('on',j===i)); const r=KC_RX[i];
    root.querySelector('#kBody').innerHTML=`<div class="eqblock">${chem('$'+rxEq(r)+'$')}</div><p>${T({ar:'حدّد مكان كل مادة في التعبير:',en:'Place each substance in the expression:'})}</p>
     ${r.sp.map((x,j)=>`<div class="kcrow"><span class="sp">${chem('$'+(x.co>1?x.co:'')+x.f+'('+x.ph+')$')}</span><select data-j="${j}" aria-label="${x.f}">${opts()}</select><span class="muted" id="kx${j}"></span></div>`).join('')}
     <div class="eqblock" id="kPrev">${chem('$K_{c}=?$')}</div><div class="ctrls"><button class="btn purple sm" id="kChk">${T({ar:'تحقّق',en:'Check'})}</button></div><div id="kFb"></div>`;
    root.querySelector('#kChk').onclick=check; }
  function choices(){return [...root.querySelectorAll('#kBody select')].map(s=>s.value)}
  function preview(){const r=KC_RX[cur],c=choices();root.querySelector('#kPrev').innerHTML=chem(kexpr(r.sp.filter((x,j)=>c[j]==='n'),r.sp.filter((x,j)=>c[j]==='d')))}
  function check(){ const r=KC_RX[cur],c=choices(); let all=true;
    r.sp.forEach((x,j)=>{ const right=(x.ph==='s'||x.ph==='l')?'o':(x.s==='P'?'n':'d'); const ok=c[j]===right; if(!ok)all=false;
      const why = right==='o'?T({ar:(x.ph==='s'?'صلب نقي':'سائل نقي')+' — تركيزه ثابت فلا يُكتب',en:'pure '+(x.ph==='s'?'solid':'liquid')+' — constant, omitted'}):
        right==='n'?T({ar:'ناتج'+(x.ph==='v'?' (بخار = غاز)':'')+' ← البسط، والأس = '+x.co,en:'product'+(x.ph==='v'?' (vapour = gas)':'')+' → numerator, power = '+x.co}):
        T({ar:'متفاعل'+(x.ph==='v'?' (بخار = غاز يُكتب)':'')+' ← المقام، والأس = '+x.co,en:'reactant'+(x.ph==='v'?' (vapour = gas, included)':'')+' → denominator, power = '+x.co});
      root.querySelector('#kx'+j).innerHTML=(ok?'✔ ':'✘ ')+why; root.querySelector('#kx'+j).style.color=ok?'#0d8a5b':'#c23a3f'; });
    const corr=kexpr(r.sp.filter(x=>x.s==='P'&&!['s','l'].includes(x.ph)),r.sp.filter(x=>x.s==='R'&&!['s','l'].includes(x.ph)));
    root.querySelector('#kFb').innerHTML=`<div class="fb ${all?'ok':'no'}">${all?T({ar:'✔ ممتاز! التعبير الصحيح:',en:'✔ Excellent! The correct expression:'}):T({ar:'راجع العلامات ✘ — التعبير الصحيح:',en:'Check the ✘ marks — correct expression:'})} <span>${chem(corr)}</span></div>`;
    logEv('sim',`kc:${r.id}:${all?'correct':'wrong'}`); }
  root.querySelectorAll('#kTabs button').forEach(b=>b.onclick=()=>show(+b.dataset.i)); show(0);
};

    <svg viewBox="0 0 90 220" width="90"><rect x="25" y="8" width="40" height="190" rx="20" fill="#f4f8ff" stroke="#9fb6d6" stroke-width="4"/><rect id="nGas" x="29" y="40" width="32" height="154" rx="16" fill="${S[25].c}" style="transition:fill .9s"/><rect x="20" y="4" width="50" height="12" rx="5" fill="#9fb6d6"/></svg>
    <div style="flex:1;min-width:230px">
     <div class="predict"><b>${T({ar:'توقّع: لو سخّنا الأنبوبة، اللون البني هيـ...؟',en:'Predict: if we heat the tube, the brown colour will...?'})}</b><div class="ctrls"><button class="btn ghost sm" data-p="up">${T({ar:'يغمق',en:'Deepen'})}</button><button class="btn ghost sm" data-p="down">${T({ar:'يفتح',en:'Fade'})}</button></div></div>

  root.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pred=b.dataset.p;root.querySelectorAll('[data-p]').forEach(x=>{x.classList.toggle('blue',x===b);x.classList.toggle('ghost',x!==b)})});
  root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const nt=+b.dataset.t; if(nt===t)return; const dir=nt>t?'up':'down'; t=nt;
    root.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b)); upd();
    let msg = dir==='up'?T({ar:'التسخين يُفضّل الاتجاه العكسي الماص للحرارة ← يتكوّن NO₂ أكثر ← اللون البني المحمر يزيد.',en:'Heating favours the endothermic reverse direction → more NO₂ → deeper reddish-brown.'}):T({ar:'التبريد يُفضّل الاتجاه الطردي الطارد للحرارة ← يتكوّن N₂O₄ أكثر ← اللون يفتح.',en:'Cooling favours the exothermic forward direction → more N₂O₄ → paler.'});
    let cls='ok'; if(pred&&dir==='up'){const ok=pred==='up';cls=ok?'ok':'no';msg=(ok?'✔ ':'✘ ')+msg}
    root.querySelector('#nFb').innerHTML=`<div class="fb ${cls}">${msg}</div>`; logEv('sim','no2:'+nt+(pred?':pred='+pred:'')); });

/* ---------- 5. Piston pressure lab ---------- */
SIMS.piston=(root)=>{
  const RX={nh3:{eq:'$N2(g)+3H2(g)<=>2NH3(g)$',L:4,Rm:2,R:[['N2',1],['H2',3]],P:[['NH3',2]],tgt:{L:.3,M:.5,S:.75}},
            co:{eq:'$CO(g)+NO2(g)<=>CO2(g)+NO(g)$',L:2,Rm:2,R:[['CO',1],['NO2',1]],P:[['CO2',1],['NO',1]],tgt:{L:.5,M:.5,S:.5}}};
  const COL={N2:['#2f7be6',7],H2:['#9fb0c8',4.5],NH3:['#15a46d',6.5],CO:['#5b6b82',6],NO2:['#a0522d',6.5],CO2:['#1c2a3f',6.5],NO:['#8a63e0',6]};
  const VOL={L:1,M:.72,S:.45}; let rx='nh3', vol='M', parts=[], raf, acc=0, last=performance.now();
  root.innerHTML=simShell(T({ar:'معمل المكبس: الضغط والحجم',en:'Piston lab: pressure and volume'}),`
   <div class="tabs" id="pRx"><button data-r="nh3" class="on">${T({ar:'عدد مولات غير متساوٍ',en:'Unequal gas moles'})}</button><button data-r="co">${T({ar:'عدد مولات متساوٍ',en:'Equal gas moles'})}</button></div>
   <div class="eqblock" id="pEq"></div>
   <canvas id="pC" width="480" height="250"></canvas>
   <div class="legend" id="pLeg" style="margin-top:6px"></div>
   <div class="ctrls"><button class="btn ghost sm" data-v="L">${T({ar:'حجم كبير (ضغط أقل)',en:'Large volume (low P)'})}</button><button class="btn ghost sm" data-v="M">${T({ar:'حجم متوسط',en:'Medium volume'})}</button><button class="btn blue sm" data-v="S">${T({ar:'حجم صغير (ضغط أعلى)',en:'Small volume (high P)'})}</button></div>
   <div class="counter"><div>${T({ar:'جزيئات المتفاعلات',en:'Reactant molecules'})}<br><span id="pR"></span></div><div>${T({ar:'جزيئات النواتج',en:'Product molecules'})}<br><span id="pP"></span></div><div>${T({ar:'تزاحم الغاز (نسبي)',en:'Gas crowding (relative)'})}<br><span id="pD"></span></div></div>
   <div id="pFb"></div>`);
  const G=fitCanvas(root.querySelector('#pC'));
  const boxW=()=>30+(G.w-60)*VOL[vol];
  const add=(f,x,y)=>parts.push({f,x:x??rnd(20,boxW()),y:y??rnd(20,G.h-20),vx:rnd(-1.2,1.2),vy:rnd(-1.2,1.2)});
  function setup(){parts=[];const r=RX[rx];const U=10,p0=Math.round(U*r.tgt[vol]);for(let i=0;i<U;i++){(i<p0?r.P:r.R).forEach(([f,n])=>{for(let k=0;k<n;k++)add(f)})}
    root.querySelector('#pEq').innerHTML=chem(r.eq)+` &nbsp; <bdi class="muted">(${r.L} ${T({ar:'مول غاز',en:'gas mol'})} → ${r.Rm})</bdi>`;
    root.querySelector('#pLeg').innerHTML=[...r.R,...r.P].map(([f])=>`<span><i style="background:${COL[f][0]};border-radius:50%"></i>${chem('$'+f+'$')}</span>`).join('');}
  function take(f,n,near){const idx=[];for(let i=0;i<parts.length&&idx.length<n;i++)if(parts[i].f===f)idx.push(i);if(idx.length<n)return null;const pos={x:parts[idx[0]].x,y:parts[idx[0]].y};idx.sort((a,b)=>b-a).forEach(i=>parts.splice(i,1));return pos}
  function cnt(f){return parts.filter(p=>p.f===f).length}
  function step(){ const r=RX[rx], t=r.tgt[vol], k=0.03; const units=f=>cnt(f[0][0])/f[0][1]; const nR=units(r.R), nP=units(r.P);
    if(Math.random()<k*t*nR){ if(r.R.every(([f,n])=>cnt(f)>=n)){let pos;r.R.forEach(([f,n])=>{const p=take(f,n);pos=pos||p});r.P.forEach(([f,n])=>{for(let i=0;i<n;i++)add(f,pos.x+rnd(-6,6),pos.y+rnd(-6,6))})} }
    if(Math.random()<k*(1-t)*nP){ if(r.P.every(([f,n])=>cnt(f)>=n)){let pos;r.P.forEach(([f,n])=>{const p=take(f,n);pos=pos||p});r.R.forEach(([f,n])=>{for(let i=0;i<n;i++)add(f,pos.x+rnd(-6,6),pos.y+rnd(-6,6))})} } }
  function draw(){ const c=G.c,W=boxW(); c.clearRect(0,0,G.w,G.h);
    const isR=document.documentElement.dir==='rtl';
    c.fillStyle='#f4f8ff'; c.fillRect(10,10,W,G.h-20); c.strokeStyle='#9fb6d6'; c.lineWidth=3; c.strokeRect(10,10,W,G.h-20);
    c.fillStyle='#c9d6ea'; c.fillRect(10+W,14,14,G.h-28); c.fillRect(24+W,G.h/2-6,G.w-W-30,12);
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.x<18){p.x=18;p.vx=Math.abs(p.vx)}if(p.x>W+2){p.x=W+2;p.vx=-Math.abs(p.vx)}if(p.y<18||p.y>G.h-18)p.vy*=-1;p.y=Math.max(18,Math.min(G.h-18,p.y));
      const [col,rad]=COL[p.f];c.fillStyle=col;c.beginPath();c.arc(p.x,p.y,rad,0,7);c.fill()}
    const r=RX[rx]; const nr=r.R.reduce((s,[f])=>s+cnt(f),0), np=r.P.reduce((s,[f])=>s+cnt(f),0);
    root.querySelector('#pR').textContent=nr; root.querySelector('#pP').textContent=np; root.querySelector('#pD').textContent=((nr+np)/(VOL[vol]*40)).toFixed(1)+'×'; }
  function loop(t){raf=requestAnimationFrame(loop);acc+=Math.min(t-last,100);last=t;while(acc>60){step();acc-=60}draw()}
  root.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ const prev=vol; vol=b.dataset.v; root.querySelectorAll('[data-v]').forEach(x=>{x.classList.toggle('blue',x===b);x.classList.toggle('ghost',x!==b)});
    if(prev===vol)return; const comp=VOL[vol]<VOL[prev];
    const msg = rx==='nh3' ? (comp?T({ar:'قلّلنا الحجم ← زاد الضغط ← الاتزان يُزاح نحو الجانب ذي المولات الغازية الأقل (النشادر: 2 مول) لمقاومة زيادة الضغط. لاحظ أن التفاعلين ما زالا يحدثان.',en:'Smaller volume → higher pressure → shift toward fewer gas moles (NH₃: 2 mol) to oppose it. Both reactions still occur.'}):T({ar:'زوّدنا الحجم ← قلّ الضغط ← الاتزان يُزاح نحو الجانب ذي المولات الأكثر (المتفاعلات: 4 مولات).',en:'Larger volume → lower pressure → shift toward more gas moles (reactants: 4 mol).'}))
      : T({ar:'عدد المولات الغازية متساوٍ (2 = 2) ← موضع الاتزان لا يُزاح. لكن لاحظ أن تزاحم الجزيئات (التركيز) '+(comp?'زاد':'قلّ')+' — "لا إزاحة" لا تعني "لا تغيير".',en:'Equal gas moles (2 = 2) → no shift in position. But crowding (concentration) '+(comp?'increased':'decreased')+' — "no shift" ≠ "no change".'});
    root.querySelector('#pFb').innerHTML=`<div class="fb ok">${msg}</div>`; logEv('sim',`piston:${rx}:${prev}->${vol}`); });
  root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rx=b.dataset.r;root.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));setup();root.querySelector('#pFb').innerHTML=''});
  setup(); raf=requestAnimationFrame(loop); root.querySelector('[data-v="M"]').click(); root.querySelector('#pFb').innerHTML='';
  return ()=>cancelAnimationFrame(raf);
};
